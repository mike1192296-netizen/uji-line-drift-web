[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="fonts/OFL.txt"
exclude_filter="tests/*,data/*,web/*,.github/*,build/*,README.md"
export_path="build/web/game/index.html"

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include="<style>html,body,canvas{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}canvas{outline:none}</style>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
