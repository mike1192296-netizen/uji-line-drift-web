<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>宇治川ライン DRIFT v0.4.3</title>
<style>html,body{margin:0;width:100%;height:100%;background:#101b24;color:#eff4f4;font:16px system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}#boot{position:fixed;inset:0;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;background:#101b24;padding:24px;text-align:center;z-index:10}#boot[hidden]{display:none}h1{font-size:28px;margin:0}progress{width:min(80vw,500px);height:14px}#detail{max-width:650px;white-space:pre-wrap;font-size:13px;color:#bdcbd3}button,a{color:#acd99d}button{background:#19342e;border:1px solid #acd99d;border-radius:8px;padding:12px;font:inherit}small{color:#879ba9}</style>
$GODOT_HEAD_INCLUDE
</head><body><canvas id="canvas"></canvas><section id="boot"><small>UJI LINE DRIFT / v0.4.3</small><h1>ゲームを読み込んでいます</h1><div id="phase">エンジンを準備しています…</div><progress id="progress"></progress><div id="detail"></div><button id="retry" hidden>再読み込み（記録は消えません）</button><a href="../" target="_top">ホームへ戻る</a></section>
<script src="$GODOT_URL"></script><script>
const config = $GODOT_CONFIG;
const threads = $GODOT_THREADS_ENABLED;
const overlay=document.getElementById('boot'),phase=document.getElementById('phase'),detail=document.getElementById('detail'),progress=document.getElementById('progress'),retry=document.getElementById('retry');
let done=false, failed=false, stage='download', lastError='', started=Date.now();
retry.onclick=()=>location.reload();
function fail(error){if(failed)return;failed=true;done=true;overlay.hidden=false;phase.textContent='起動できませんでした';progress.hidden=true;detail.textContent=String(error?.message||error||'Unknown error').slice(0,700)+'\n別のタブで開き直すか、通常のChrome / Safariでお試しください。記録を消す必要はありません。';retry.hidden=false;clearInterval(timer);}
window.addEventListener('error',e=>fail(e.error||e.message));
window.addEventListener('unhandledrejection',e=>fail(e.reason));
document.getElementById('canvas').addEventListener('webglcontextlost',e=>{e.preventDefault();fail('描画用メモリの確保に失敗しました。他の重いタブを閉じて再読み込みしてください。');});
const timer=setInterval(()=>{if(done)return;const elapsed=Math.floor((Date.now()-started)/1000);if(stage==='init')phase.textContent='読み込み完了・エンジンを起動しています… '+elapsed+'秒';if(elapsed>=45){detail.textContent='初回の起動準備には時間がかかる場合があります。変化がない場合は再読み込み、または通常のChrome / Safariで開いてください。'+(lastError?'\n'+lastError:'');retry.hidden=false;}},1000);
try{
 const missing=Engine.getMissingFeatures({threads});
 if(missing.length)fail('このブラウザでは必要な機能が利用できません: '+missing.join(', '));
 else {
  const engine=new Engine(config);
  engine.startGame({onPrintError:(...args)=>{lastError=args.join(' ').slice(0,500);console.error(...args);},onProgress:(current,total)=>{if(done)return;if(total>0&&current>=total){stage='init';phase.textContent='読み込み完了・エンジンを起動しています…';progress.removeAttribute('value');}else if(total>0){progress.max=total;progress.value=current;phase.textContent='ゲームデータを読み込んでいます… '+Math.round(current/total*100)+'%';}}}).then(()=>{if(failed)return;done=true;clearInterval(timer);overlay.hidden=true;},fail);
 }
}catch(error){fail(error);}
</script></body></html>
